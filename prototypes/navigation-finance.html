<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Прототипы — Доход</title>
<style>
:root{color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;background:#080d0b;color:#f4f7f5}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% -10%,#203a2e 0,#0c1511 34%,#080d0b 72%);-webkit-font-smoothing:antialiased}
.stage{width:min(100%,480px);min-height:100vh;margin:auto;padding:44px 18px 122px;display:flex;flex-direction:column;gap:28px}
.eyebrow{margin:0 0 8px;color:#8fa79b;font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}.title{margin:0;font-size:30px;line-height:1.05;letter-spacing:-.04em}.subtitle{margin:10px 0 0;color:#9aada3;font-size:15px}
.hero{position:relative;overflow:hidden;padding:24px 20px 20px;border:1px solid rgba(255,255,255,.08);border-radius:24px;background:#0d1a15;box-shadow:0 18px 40px rgba(0,0,0,.24)}.hero:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 84% 12%,rgba(64,168,117,.18),transparent 42%);pointer-events:none}.hero>*{position:relative}
.hero-label{margin:0;color:#9db0a7;font-size:14px;font-weight:600;text-align:center}.hero-value{margin:7px 0 20px;color:#fff;font-size:52px;line-height:.96;letter-spacing:-.065em;font-weight:760;text-align:center;font-variant-numeric:tabular-nums}.hero-rule{height:1px;background:rgba(255,255,255,.1)}.hero-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}.metric{padding:12px 13px;border-radius:15px;background:rgba(255,255,255,.045)}.metric-label{margin:0;color:#91a69b;font-size:12px;line-height:1.2}.metric-value{margin:6px 0 0;color:#eef5f1;font-size:17px;font-weight:700;font-variant-numeric:tabular-nums}.hero--balance .hero-value{text-align:left;font-size:44px}.hero--balance .hero-label{text-align:left}.hero--balance .hero-grid{grid-template-columns:1fr}.hero--balance .metric{display:flex;justify-content:space-between;align-items:center}.hero--balance .metric-value{margin:0}.hero--ledger{padding:18px 16px}.hero--ledger .hero-top{display:flex;align-items:end;justify-content:space-between;gap:16px}.hero--ledger .hero-label{text-align:left}.hero--ledger .hero-value{margin:4px 0 0;font-size:42px;text-align:left}.hero--ledger .hero-grid{gap:7px}.hero--ledger .metric{background:transparent;border-top:1px solid rgba(255,255,255,.1);border-radius:0;padding:12px 0 0}.hero--ledger .metric-label{font-size:11px}.hero--ledger .metric-value{font-size:18px}
.feed{display:grid;gap:11px}.feed h2{margin:0;font-size:20px;letter-spacing:-.03em}.feed-card{display:flex;align-items:center;justify-content:space-between;padding:15px 16px;border-radius:18px;background:#111d18;border:1px solid rgba(255,255,255,.07)}.feed-card span{color:#91a69b;font-size:13px}.feed-card strong{font-size:17px;font-variant-numeric:tabular-nums}
.proto-picker{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:2147483647;display:flex;align-items:center;gap:2px;padding:4px;border-radius:999px;background:rgba(10,10,10,.82);-webkit-backdrop-filter:blur(12px) saturate(1.4);backdrop-filter:blur(12px) saturate(1.4);box-shadow:0 0 0 1px rgba(255,255,255,.08) inset,0 8px 24px rgba(0,0,0,.24),0 2px 6px rgba(0,0,0,.12);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:13px;line-height:1;-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none}.proto-picker-highlight{position:absolute;top:4px;left:0;height:28px;border-radius:999px;background:rgba(255,255,255,.12);will-change:transform}.proto-picker[data-ready] .proto-picker-highlight{transition:transform 250ms cubic-bezier(.23,1,.32,1),width 250ms cubic-bezier(.23,1,.32,1)}.proto-picker-item{position:relative;display:flex;align-items:center;height:28px;padding:0 12px;border:0;border-radius:999px;background:transparent;color:rgba(255,255,255,.55);font:inherit;cursor:pointer;transition:color 150ms ease-out}.proto-picker-item:hover{color:rgba(255,255,255,.85)}.proto-picker-item:active{transform:scale(.97)}.proto-picker-item:focus-visible{outline:2px solid rgba(255,255,255,.4);outline-offset:2px}.proto-picker-item[data-active]{color:#fff}.proto-picker-divider{width:1px;height:16px;margin:0 4px;background:rgba(255,255,255,.12)}.proto-picker-replay{padding:0 10px;font-size:14px}.proto-picker[data-position=top]{bottom:auto;top:24px}
.nav-picker{bottom:24px}.hero-picker{top:24px;bottom:auto}
.dock{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,480px);padding:8px 18px calc(8px + env(safe-area-inset-bottom));background:#0b1210;border-top:1px solid rgba(255,255,255,.08);z-index:20}.dock-inner{position:relative;display:grid;grid-template-columns:repeat(4,1fr);height:54px}.dock-item{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;border:0;background:none;color:#718279;font:600 11px/1 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;cursor:pointer}.dock-item svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.dock-highlight{position:absolute;left:0;top:1px;width:25%;height:52px;border-radius:16px;background:#1c9a68;box-shadow:0 5px 14px rgba(0,0,0,.24);will-change:transform}.dock[data-nav="0"] .dock-highlight{background:transparent;box-shadow:none;border-bottom:3px solid #72d5a4}.dock[data-nav="1"] .dock-highlight{border-radius:16px;background:#1c9a68}.dock[data-nav="2"] .dock-highlight{background:rgba(114,213,164,.14);box-shadow:inset 0 0 0 1px rgba(114,213,164,.45)}.dock[data-nav="3"] .dock-highlight{top:5px;height:44px;border-radius:12px;background:#23352d;box-shadow:none}.dock[data-nav="0"] .dock-item[data-current]{color:#72d5a4}.dock[data-nav="1"] .dock-item[data-current]{color:#fff}.dock[data-nav="2"] .dock-item[data-current]{color:#b7f0d1}.dock[data-nav="3"] .dock-item[data-current]{color:#fff}
.dock[data-nav="1"] .dock-item[data-current] svg{animation:nav-pop 280ms cubic-bezier(.22,1,.36,1)}.dock[data-nav="2"] .dock-item[data-current] svg{animation:nav-pulse 300ms ease-out}.dock[data-nav="3"] .dock-item[data-current]{animation:nav-rise 280ms cubic-bezier(.22,1,.36,1)}
@keyframes nav-pop{0%{transform:scale(.82) translateY(3px)}65%{transform:scale(1.1) translateY(-2px)}100%{transform:scale(1) translateY(0)}}@keyframes nav-pulse{0%{opacity:.45;transform:scale(.86)}100%{opacity:1;transform:scale(1)}}@keyframes nav-rise{0%{opacity:.5;transform:translateY(4px)}100%{opacity:1;transform:translateY(0)}}
@media (prefers-reduced-motion:reduce){.proto-picker[data-ready] .proto-picker-highlight{transition:none}.dock-item[data-current] svg,.dock-item[data-current]{animation:none!important}}
.dock-highlight{transition:transform 280ms cubic-bezier(.22,1,.36,1)}
@media (prefers-reduced-motion:reduce){.dock-highlight{transition:none}}
</style>
</head>
<body>
<main class="stage">
  <header><p class="eyebrow">Прототипы интерфейса</p><h1 class="title">Доход за месяц</h1><p class="subtitle">Выбери вариант, который ощущается самым спокойным и понятным.</p></header>
  <section id="hero-stage"></section>
  <section class="feed"><h2>Последние записи</h2><div class="feed-card"><div><strong>Navitel</strong><br><span>Обзор</span></div><strong>78 000 ₽</strong></div><div class="feed-card"><div><strong>iBox Rover</strong><br><span>Продажа Авито</span></div><strong>11 070 ₽</strong></div></section>
</main>
<nav class="proto-picker hero-picker" data-position="top" aria-label="Варианты блока дохода"><span class="proto-picker-highlight" aria-hidden="true"></span><button class="proto-picker-item" data-active aria-current="true">Фокус</button><button class="proto-picker-item">Баланс</button><button class="proto-picker-item">Реестр</button><span class="proto-picker-divider" aria-hidden="true"></span><button class="proto-picker-item proto-picker-replay" aria-label="Повторить анимацию (R)">↻</button></nav>
<nav class="proto-picker nav-picker" aria-label="Варианты анимации меню"><span class="proto-picker-highlight" aria-hidden="true"></span><button class="proto-picker-item" data-active aria-current="true">Линия</button><button class="proto-picker-item">Импульс</button><button class="proto-picker-item">Свет</button><span class="proto-picker-divider" aria-hidden="true"></span><button class="proto-picker-item proto-picker-replay" aria-label="Повторить анимацию (R)">↻</button></nav>
<nav class="dock" data-nav="0" aria-label="Основная навигация"><div class="dock-inner"><span class="dock-highlight" aria-hidden="true"></span><button class="dock-item" data-current><svg viewBox="0 0 24 24"><path d="M3 10.2 12 3.5l9 6.7"/><path d="M5.4 9.2V19a1.4 1.4 0 0 0 1.4 1.4h10.4A1.4 1.4 0 0 0 18.6 19V9.2"/><path d="M9.8 20.4v-5.6h4.4v5.6"/></svg>Главная</button><button class="dock-item"><svg viewBox="0 0 24 24"><path d="M4 20.2V4"/><path d="M4 20.2h16"/><path d="M8.4 16.6v-4.4M12.6 16.6V8M16.8 16.6v-6.6"/></svg>Статистика</button><button class="dock-item"><svg viewBox="0 0 24 24"><path d="M19.4 8.2V7a1.6 1.6 0 0 0-1.6-1.6H5.6A1.6 1.6 0 0 0 4 7v10a1.6 1.6 0 0 0 1.6 1.6h12.2a1.6 1.6 0 0 0 1.6-1.6v-1.2"/><path d="M20.6 10.2h-4a1.9 1.9 0 0 0 0 3.8h4"/></svg>Финансы</button><button class="dock-item"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="m19 15 .8 1.7-1.9 1.9-1.7-.8a7 7 0 0 1-1.7.7l-.6 1.8h-2.7l-.6-1.8a7 7 0 0 1-1.7-.7l-1.7.8-1.9-1.9.8-1.7a7 7 0 0 1-.7-1.7L3.4 12v-2.7l1.8-.6a7 7 0 0 1 .7-1.7l-.8-1.7L7 3.4l1.7.8a7 7 0 0 1 1.7-.7l.6-1.8h2.7l.6 1.8a7 7 0 0 1 1.7.7l1.7-.8 1.9 1.9-.8 1.7a7 7 0 0 1 .7 1.7l1.8.6V12l-1.8.6A7 7 0 0 1 19 15Z"/></svg>Настройки</button></div></nav>
<script>
const heroStage=document.getElementById('hero-stage'), heroPicker=document.querySelector('.hero-picker'), navPicker=document.querySelector('.nav-picker'), dock=document.querySelector('.dock');
const heroItems=[...heroPicker.querySelectorAll('.proto-picker-item:not(.proto-picker-replay)')],navItems=[...navPicker.querySelectorAll('.proto-picker-item:not(.proto-picker-replay)')];
const heroVariants=[
()=>'<article class="hero hero--focus"><p class="hero-label">Получено в этом месяце</p><p class="hero-value">155 000 ₽</p><div class="hero-rule"></div><div class="hero-grid"><div class="metric"><p class="metric-label">Ещё ожидается</p><p class="metric-value">0 ₽</p></div><div class="metric"><p class="metric-label">Всего с учётом ожидаемого</p><p class="metric-value">155 000 ₽</p></div></div></article>',
()=>'<article class="hero hero--balance"><p class="hero-label">Итог месяца</p><p class="hero-value">155 000 ₽</p><div class="hero-grid"><div class="metric"><p class="metric-label">Получено</p><p class="metric-value">155 000 ₽</p></div><div class="metric"><p class="metric-label">Ожидается</p><p class="metric-value">0 ₽</p></div><div class="metric"><p class="metric-label">Изменение к августу</p><p class="metric-value">+39%</p></div></div></article>',
()=>'<article class="hero hero--ledger"><div class="hero-top"><div><p class="hero-label">Сентябрь 2026</p><p class="hero-value">155 000 ₽</p></div><p class="metric-label">4 записи</p></div><div class="hero-grid"><div class="metric"><p class="metric-label">Получено</p><p class="metric-value">155 000 ₽</p></div><div class="metric"><p class="metric-label">Ожидается</p><p class="metric-value">0 ₽</p></div></div></article>'
];
function pickerMove(picker,items,current){const h=picker.querySelector('.proto-picker-highlight'),el=items[current];h.style.width=el.offsetWidth+'px';h.style.transform='translateX('+el.offsetLeft+'px)'}
function setPicker(picker,items,current,param){items.forEach((el,i)=>{el.toggleAttribute('data-active',i===current);if(i===current)el.setAttribute('aria-current','true');else el.removeAttribute('aria-current')});pickerMove(picker,items,current);const u=new URL(location);u.searchParams.set(param,current+1);history.replaceState(null,'',u)}
let hi=0,ni=0,navCurrent=0;
function mountHero(){heroStage.innerHTML=heroVariants[hi]()}
function setHero(i){hi=(i+heroVariants.length)%heroVariants.length;setPicker(heroPicker,heroItems,hi,'hero');mountHero()}
heroItems.forEach((el,i)=>el.addEventListener('click',()=>setHero(i)));heroPicker.querySelector('.proto-picker-replay').addEventListener('click',mountHero);
navItems.forEach((el,i)=>el.addEventListener('click',()=>setNav(i)));navPicker.querySelector('.proto-picker-replay').addEventListener('click',()=>replayNav());
function setNav(i){ni=(i+navItems.length)%navItems.length;setPicker(navPicker,navItems,ni,'nav');dock.dataset.nav=ni;moveDock()}
function moveDock(){dock.querySelector('.dock-highlight').style.transform='translateX('+(navCurrent*100)+'%)';dock.querySelectorAll('.dock-item').forEach((el,j)=>el.toggleAttribute('data-current',j===navCurrent))}
function selectDock(i){navCurrent=i;moveDock();const item=dock.querySelector('.dock-item[data-current]');if(item){item.style.animation='none';void item.offsetWidth;item.style.animation=''}}
function replayNav(){selectDock(navCurrent)}
dock.querySelectorAll('.dock-item').forEach((el,i)=>el.addEventListener('click',()=>selectDock(i)));
document.addEventListener('keydown',e=>{if(e.target.matches('input,textarea,select,[contenteditable]')||e.metaKey||e.ctrlKey||e.altKey)return;const n=parseInt(e.key,10);if(n>=1&&n<=3)setNav(n-1);else if(e.key==='ArrowRight')setNav(ni+1);else if(e.key==='ArrowLeft')setNav(ni-1);else if(e.key==='r'||e.key==='R'){mountHero();setNav(ni)}});
let heroParam=(parseInt(new URLSearchParams(location.search).get('hero'),10)||1)-1,navParam=(parseInt(new URLSearchParams(location.search).get('nav'),10)||1)-1;hi=Math.max(0,Math.min(2,heroParam));ni=Math.max(0,Math.min(2,navParam));setPicker(heroPicker,heroItems,hi,'hero');setPicker(navPicker,navItems,ni,'nav');mountHero();dock.dataset.nav=ni;moveDock();requestAnimationFrame(()=>requestAnimationFrame(()=>{heroPicker.setAttribute('data-ready','');navPicker.setAttribute('data-ready','')}));
window.addEventListener('resize',()=>{pickerMove(heroPicker,heroItems,hi);pickerMove(navPicker,navItems,ni)});
</script>
</body>
</html>
