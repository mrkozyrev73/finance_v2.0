<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Прототипы — блок дохода</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;color:#15201a;background:#f5f7f6;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#f5f7f6}.stage{width:min(100%,480px);margin:auto;padding:72px 24px 110px}.eyebrow{margin:0 0 8px;color:#82948b;font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}.title{margin:0;font-size:30px;line-height:1.05;letter-spacing:-.045em}.subtitle{margin:10px 0 34px;color:#77877f;font-size:15px}.context{margin:0 0 10px;color:#7d8f86;font-size:13px;font-weight:650}.hero{min-height:270px;display:flex;flex-direction:column;justify-content:center}.label{margin:0;color:#7b8d84;font-size:14px;line-height:1.25;font-weight:600;text-align:center}.amount{margin:9px 0 0;color:#15201a;font-family:ui-rounded,-apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif;font-size:54px;line-height:.95;letter-spacing:-.07em;font-weight:760;text-align:center;font-variant-numeric:tabular-nums}.rule{height:1px;margin:25px 0 0;background:#d7dfda}..metrics{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:14px}.metric{min-width:0}.metric+.metric{border-left:1px solid #d7dfda;padding-left:24px}.metric-label{margin:0;color:#85948d;font-size:12px;line-height:1.25}.metric-value{margin:6px 0 0;font-family:ui-rounded,-apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif;font-size:18px;font-weight:720;font-variant-numeric:tabular-nums}.hero--quiet{min-height:245px}.hero--quiet .amount{font-size:48px}.hero--quiet .metrics{display:flex;justify-content:center;gap:30px;text-align:center}.hero--quiet .metric+.metric{border-left:0;padding-left:0}.hero--quiet .rule{width:72px;margin:24px auto 0;background:#1b9d68}.hero--editorial{min-height:300px;align-items:center;text-align:center}.hero--editorial .label{font-size:15px}.hero--editorial .amount{font-size:64px;color:#17865b}.hero--editorial .rule{width:100%;margin:28px 0 0}.hero--editorial .metrics{width:100%;text-align:left}.hero--editorial .metric-label{font-size:11px;text-transform:uppercase;letter-spacing:.08em}.hero--editorial .metric-value{font-size:20px}.notes{display:grid;gap:10px;margin-top:24px}.note{padding:15px 16px;border-top:1px solid #d7dfda;color:#687970;font-size:14px}.note strong{display:block;margin-bottom:3px;color:#15201a;font-size:16px}
.proto-picker{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:2147483647;display:flex;align-items:center;gap:2px;padding:4px;border-radius:999px;background:rgba(10,10,10,.82);-webkit-backdrop-filter:blur(12px) saturate(1.4);backdrop-filter:blur(12px) saturate(1.4);box-shadow:0 0 0 1px rgba(255,255,255,.08) inset,0 8px 24px rgba(0,0,0,.24),0 2px 6px rgba(0,0,0,.12);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:13px;line-height:1;-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none}.proto-picker-highlight{position:absolute;top:4px;left:0;height:28px;border-radius:999px;background:rgba(255,255,255,.12);will-change:transform}.proto-picker[data-ready] .proto-picker-highlight{transition:transform 250ms cubic-bezier(.23,1,.32,1),width 250ms cubic-bezier(.23,1,.32,1)}.proto-picker-item{position:relative;display:flex;align-items:center;height:28px;padding:0 12px;border:0;border-radius:999px;background:transparent;color:rgba(255,255,255,.55);font:inherit;cursor:pointer;transition:color 150ms ease-out}.proto-picker-item:hover{color:rgba(255,255,255,.85)}.proto-picker-item:active{transform:scale(.97)}.proto-picker-item:focus-visible{outline:2px solid rgba(255,255,255,.4);outline-offset:2px}.proto-picker-item[data-active]{color:#fff}.proto-picker-divider{width:1px;height:16px;margin:0 4px;background:rgba(255,255,255,.12)}.proto-picker-replay{padding:0 10px;font-size:14px}.proto-picker[data-position=top]{bottom:auto;top:24px}@media(prefers-reduced-motion:reduce){.proto-picker[data-ready] .proto-picker-highlight{transition:none}}
/* Fix the metrics rule for the standalone prototype. */
.metrics{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:14px}
</style>
</head>
<body>
<main class="stage"><p class="eyebrow">Доход</p><h1 class="title">Сентябрь 2026</h1><p class="subtitle">Три направления без карточных подложек.</p><p class="context">Получено в этом месяце</p><section id="stage"></section><div class="notes"><div class="note"><strong>Ещё ожидается</strong>0 ₽</div><div class="note"><strong>Всего с учётом ожидаемого</strong>155 000 ₽</div></div></main>
<nav class="proto-picker" data-position="top" aria-label="Варианты блока дохода"><span class="proto-picker-highlight" aria-hidden="true"></span><button class="proto-picker-item" data-active aria-current="true">Тихий</button><button class="proto-picker-item">Баланс</button><button class="proto-picker-item">Акцент</button><span class="proto-picker-divider" aria-hidden="true"></span><button class="proto-picker-item proto-picker-replay" aria-label="Повторить анимацию (R)">↻</button></nav>
<script>
const stage=document.getElementById('stage'),picker=document.querySelector('.proto-picker'),items=[...picker.querySelectorAll('.proto-picker-item:not(.proto-picker-replay)')];let current=0;
const variants=[
()=>'<article class="hero hero--quiet"><p class="label">Получено в этом месяце</p><p class="amount">155 000 ₽</p><div class="rule"></div><div class="metrics"><div class="metric"><p class="metric-label">Ожидается</p><p class="metric-value">0 ₽</p></div><div class="metric"><p class="metric-label">Всего</p><p class="metric-value">155 000 ₽</p></div></div></article>',
()=>'<article class="hero hero--balance"><p class="label">Итог месяца</p><p class="amount">155 000 ₽</p><div class="rule"></div><div class="metrics"><div class="metric"><p class="metric-label">Получено</p><p class="metric-value">155 000 ₽</p></div><div class="metric"><p class="metric-label">Ожидается</p><p class="metric-value">0 ₽</p></div></div></article>',
()=>'<article class="hero hero--editorial"><p class="label">Чистый результат</p><p class="amount">155 000 ₽</p><div class="rule"></div><div class="metrics"><div class="metric"><p class="metric-label">Получено</p><p class="metric-value">155 000 ₽</p></div><div class="metric"><p class="metric-label">Ожидается</p><p class="metric-value">0 ₽</p></div></div></article>'
];
function move(){const el=items[current],h=picker.querySelector('.proto-picker-highlight');h.style.width=el.offsetWidth+'px';h.style.transform='translateX('+el.offsetLeft+'px)'}
function mount(){stage.innerHTML=variants[current]()}
function set(i){current=(i+3)%3;items.forEach((el,j)=>{el.toggleAttribute('data-active',j===current);if(j===current)el.setAttribute('aria-current','true');else el.removeAttribute('aria-current')});move();const u=new URL(location);u.searchParams.set('v',current+1);history.replaceState(null,'',u);mount()}
items.forEach((el,i)=>el.addEventListener('click',()=>set(i)));picker.querySelector('.proto-picker-replay').addEventListener('click',mount);document.addEventListener('keydown',e=>{if(e.target.matches('input,textarea,select,[contenteditable]')||e.metaKey||e.ctrlKey||e.altKey)return;const n=parseInt(e.key,10);if(n>=1&&n<=3)set(n-1);else if(e.key==='ArrowRight')set(current+1);else if(e.key==='ArrowLeft')set(current-1);else if(e.key==='r'||e.key==='R')mount()});current=Math.max(0,Math.min(2,(parseInt(new URLSearchParams(location.search).get('v'),10)||1)-1));set(current);requestAnimationFrame(()=>requestAnimationFrame(()=>picker.setAttribute('data-ready','')));window.addEventListener('resize',move);
</script>
</body>
</html>
